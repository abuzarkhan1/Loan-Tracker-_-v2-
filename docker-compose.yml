services:
  api:
    container_name: loan-tracker-api
    image: loan-tracker-api:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGODB_URI: ${MONGODB_URI:-mongodb://127.0.0.1:27017/loan_tracker}
    network_mode: host
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5050/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web-app:
    container_name: loan-tracker-web-app
    image: loan-tracker-web-app:local
    build:
      context: ./web-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${WEB_APP_API_URL:-https://tracker.marenax.site/api}
        VITE_APP_NAME: ${WEB_APP_NAME:-Loan Tracker}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_APP_PORT:-5173}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s